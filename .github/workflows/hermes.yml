name: Hermes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Must track the commit pinned in react-native/sdks/.hermesv1version for the
  # React Native version meowl targets (RN 0.86 → hermes-v250829098.0.17).
  HERMES_COMMIT: 3477757eb2475555cf8d8df24bfb1deb0613880d

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - id: hermes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/hermes-build
          key: hermes-${{ runner.os }}-${{ env.HERMES_COMMIT }}

      - name: Build hermes
        if: steps.hermes.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libicu-dev python3
          mkdir -p ~/hermes-src
          git -C ~/hermes-src init
          git -C ~/hermes-src remote add origin https://github.com/facebook/hermes.git
          git -C ~/hermes-src fetch --depth 1 origin "$HERMES_COMMIT"
          git -C ~/hermes-src checkout FETCH_HEAD
          cmake -S ~/hermes-src -B ~/hermes-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build ~/hermes-build --target hermes

      - name: Smoke
        run: HERMES="$HOME/hermes-build/bin/hermes" bun run smoke:hermes
